<!DOCTYPE html>
<html lang="tr" class="light">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Şifreyi Sıfırla | ReviseMe</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#6d23f9",
                        "primary-dark": "#5a1cd6",
                        "bg-light": "#f8fafc",
                        "text-main": "#1e293b",
                        "text-muted": "#64748b"
                    },
                    fontFamily: {
                        "sans": ["Outfit", "sans-serif"],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: 'Outfit', sans-serif;
            color: #1e293b;
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(124, 58, 237, 0.05) 0px, transparent 50%);
        }
        .lucy-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 25px 50px -12px rgba(109, 35, 249, 0.12), 0 0 0 1px rgba(255,255,255,0.5) inset;
        }
        .lucy-input-field {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 1);
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .lucy-input-field:focus-within {
            border-color: #6d23f9;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 3px rgba(109, 35, 249, 0.15);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">

<!-- Flash Messages -->
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-full max-w-md px-4">
            {% for category, message in messages %}
                <div class="lucy-glass text-slate-800 p-4 rounded-xl shadow-lg mb-2 flex justify-between items-center border-l-4 {% if category == 'success' %}border-l-green-500{% else %}border-l-red-500{% endif %}">
                    <span class="text-sm font-medium">{{ message }}</span>
                    <button onclick="this.parentElement.style.display='none'" class="opacity-50 hover:opacity-100"><span class="material-symbols-outlined text-[18px]">close</span></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<!-- Soft Illustration Background (Same as Forgot Password) -->
<div class="absolute top-0 right-0 w-full lg:w-[60%] h-full flex items-center justify-center pointer-events-none z-0 overflow-hidden">
    <div class="relative w-full h-full flex items-center justify-center">
        <div class="absolute w-[600px] h-[600px] bg-indigo-400/10 rounded-full blur-[140px] animate-pulse"></div>
        <img src="{{ url_for('static', filename='images/ai_learning_illustration.png') }}" alt="AI Learning Illustration" 
             class="w-[110%] max-w-[700px] object-contain translate-x-10 lg:translate-x-16 scale-110 drop-shadow-[0_20px_60px_rgba(79,70,229,0.1)] opacity-40 transition-all duration-1000" 
             style="filter: brightness(1.02) contrast(1.05) hue-rotate(-15deg) saturate(1.1) grayscale(0.2);">
    </div>
    <div class="absolute inset-0 bg-gradient-to-l from-transparent via-transparent to-[#f8fafc] z-10"></div>
</div>

<!-- Main Content -->
<div class="w-full max-w-[1280px] px-6 relative z-10 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-[480px]">
        
        <!-- Logo Area -->
        <div class="flex flex-col items-center mb-10">
            <div class="text-primary bg-white p-4 rounded-[20px] shadow-xl border border-slate-50 mb-4 animate-bounce-gentle">
                <span class="material-symbols-outlined text-[40px]">key</span>
            </div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">Yeni Şifre</h1>
            <p class="text-slate-500 text-sm mt-2 text-center max-w-[300px]">
                Lütfen yeni şifrenizi belirleyin.
            </p>
        </div>

        <!-- Reset Card -->
        <div class="lucy-glass rounded-[32px] p-8 sm:p-12 shadow-2xl shadow-indigo-200/20">
            <form method="POST" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Password Input -->
                <div class="space-y-3">
                    <label class="block text-[13px] font-black text-slate-700 ml-1 uppercase tracking-wider" for="password">Yeni Şifre</label>
                    <div class="relative lucy-input-field rounded-[16px] flex items-center group transition-all">
                        <div class="pl-5 text-slate-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[22px]">lock</span>
                        </div>
                        <input name="password" id="password" type="password" required 
                               class="w-full bg-transparent border-none px-4 py-4.5 text-[15px] text-slate-800 placeholder-slate-400 focus:ring-0 focus:outline-none font-semibold" 
                               placeholder="••••••••••••"/>
                    </div>
                </div>

                <!-- Confirm Password Input -->
                <div class="space-y-3">
                    <label class="block text-[13px] font-black text-slate-700 ml-1 uppercase tracking-wider" for="confirm_password">Yeni Şifre (Tekrar)</label>
                    <div class="relative lucy-input-field rounded-[16px] flex items-center group transition-all">
                        <div class="pl-5 text-slate-400 group-focus-within:text-primary transition-colors">
                            <span class="material-symbols-outlined text-[22px]">lock_clock</span>
                        </div>
                        <input name="confirm_password" id="confirm_password" type="password" required 
                               class="w-full bg-transparent border-none px-4 py-4.5 text-[15px] text-slate-800 placeholder-slate-400 focus:ring-0 focus:outline-none font-semibold" 
                               placeholder="••••••••••••"/>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="pt-4 space-y-4">
                    <button type="submit" class="w-full py-5 bg-primary text-white rounded-[16px] font-black text-[15px] hover:bg-primary-dark hover:-translate-y-1 transition-all duration-300 active:scale-[0.97] shadow-[0_12px_24px_rgba(109,35,249,0.3)]">
                        Şifreyi Güncelle
                    </button>
                    
                    <div class="text-center pt-2">
                        <a href="{{ url_for('login') }}" class="inline-flex items-center gap-2 text-[14px] font-bold text-slate-500 hover:text-primary transition-all group">
                            <span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform">close</span>
                            Vazgeç ve Giriş Yap
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    @keyframes bounce-gentle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
</style>

</body>
</html>
